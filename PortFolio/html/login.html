<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login Form || Portfolio</title>
        <link rel="stylesheet" href="../css/login.css" />
    </head>
    <body>
        <div class="container">
            <div class="form-container">
                <input type="checkbox" id="toggle-form" hidden />
                <div class="form-blob">
                    <img src="../img/blob.svg" alt="blob" class="blob-image blob-image--1" />
                    <img src="../img/blob.svg" alt="blob" class="blob-image blob-image--2" />
                    <img src="../img/blob.svg" alt="blob" class="blob-image blob-image--3" />
                </div>

                <div class="form-header">
                    <h1>Đăng nhập</h1>
                    <p>Chào mừng trở lại! Vui lòng nhập thông tin của bạn.</p>
                </div>
                <form class="form-box" action="admin.html">
                    <div class="input-group">
                        <input type="email" id="email" class="input-field" placeholder="example@gmail.com" required />
                        <label for="email" class="floating-label">Email</label>
                    </div>
                    <div class="input-group">
                        <input type="password" id="password" class="input-field" placeholder="" required />
                        <label for="password" class="floating-label">Mật khẩu</label>
                        <div class="eye-icon">
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="24"
                                height="24"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.5"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                class="lucide lucide-eye-icon lucide-eye">
                                <path
                                    d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </div>
                    </div>
                    <div class="input-group checkbox-group">
                        <div class="form-col remember-me">
                            <input type="checkbox" id="remember-me-checkbox" class="checkbox-field" />
                            <label for="remember-me-checkbox">Ghi nhớ đăng nhập</label>
                        </div>
                        <div class="form-col">
                            <a href="#" class="form-link">Quên mật khẩu?</a>
                        </div>
                    </div>
                    <button type="submit" class="form-btn form-btn--submit">Đăng nhập</button>
                </form>
                <div class="form-divider">
                    <p>Hoặc</p>
                </div>
                <div class="form-bottom">
                    <div class="form-socials">
                        <button class="form-btn form-btn--social">
                            <img src="../img/google.svg" alt="social icon" class="btn-icon" />
                        </button>
                        <button class="form-btn form-btn--social">
                            <img src="../img/facebook.svg" alt="social icon" class="btn-icon" />
                        </button>
                        <button class="form-btn form-btn--social">
                            <img src="../img/apple.svg" alt="social icon" class="btn-icon" />
                        </button>
                    </div>
                    <p>Chỉ dành cho quản trị viên.</p>
                    <a href="homepage.html" class="back-home">Quay lại Portfolio </a>
                </div>
            </div>
        </div>
    </body>
</html>
